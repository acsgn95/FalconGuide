name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev
      - "feature/**"
      - "release/**"
      - "hotfix/**"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libeigen3-dev \
            libceres-dev \
            nlohmann-json3-dev

      - name: Configure
        run: >
          cmake -S . --preset linux-system
          -DFALCONGUIDE_ENABLE_GTSAM=OFF
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build/linux-system

      - name: Test
        run: ctest --test-dir build/linux-system --output-on-failure
