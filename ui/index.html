<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FalconGuide</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:12px/1.5 monospace;background:#0d1117;color:#c9d1d9;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Header ── */
header{display:flex;align-items:center;gap:12px;padding:6px 14px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;min-height:36px}
header h1{font-size:14px;font-weight:bold;color:#58a6ff;letter-spacing:.5px}
.dot{width:9px;height:9px;border-radius:50%;background:#484f58;transition:background .3s}
.dot.on{background:#3fb950}
.badge{padding:1px 8px;border-radius:10px;font-size:11px;background:#21262d;border:1px solid #30363d;color:#8b949e}
.badge.running{background:#1a3626;border-color:#3fb950;color:#3fb950}
.badge.error{background:#3b1a1a;border-color:#f85149;color:#f85149}
header .spacer{flex:1}
#tsLabel{color:#484f58;font-size:10px}

/* ── Main layout ── */
.main{display:flex;flex:1;overflow:hidden}
.map-wrap{flex:1;position:relative}
#map{width:100%;height:100%}

/* ── Side panel ── */
.side{width:340px;display:flex;flex-direction:column;background:#161b22;border-left:1px solid #30363d;overflow:hidden;flex-shrink:0}

/* ── State box ── */
.box{padding:10px 12px;border-bottom:1px solid #21262d;flex-shrink:0}
.box-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#58a6ff;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;padding:1px 0}
.kv .k{color:#8b949e}
.kv .v{color:#e6edf3;font-weight:bold}
.kv .v.warn{color:#d29922}
.kv .v.ok{color:#3fb950}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}

/* ── Replay controls ── */
.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.btn{padding:3px 10px;background:#21262d;border:1px solid #30363d;color:#c9d1d9;cursor:pointer;border-radius:5px;font:11px monospace;transition:all .15s}
.btn:hover{background:#30363d;border-color:#58a6ff;color:#58a6ff}
.btn.active{background:#1f4428;border-color:#3fb950;color:#3fb950}
.btn.danger:hover{border-color:#f85149;color:#f85149}
select{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:3px 6px;font:11px monospace;border-radius:5px;cursor:pointer}
.prog-bar{background:#21262d;height:5px;border-radius:3px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;background:#58a6ff;transition:width .4s}
.prog-text{font-size:10px;color:#484f58;margin-top:3px}

/* ── Charts ── */
.charts{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.tabs{display:flex;border-bottom:1px solid #21262d;flex-shrink:0}
.tab{padding:5px 12px;cursor:pointer;font-size:11px;color:#484f58;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:#8b949e}
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff}
.chart-wrap{flex:1;padding:8px;overflow:hidden;position:relative}
.chart-wrap canvas{max-height:100%!important}

/* ── Config ── */
.cfg-panel{border-top:1px solid #30363d;flex-shrink:0}
.cfg-header{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;cursor:pointer;user-select:none;background:#161b22}
.cfg-header:hover{background:#1c2128}
.cfg-header span:first-child{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#58a6ff}
.cfg-body{display:none;padding:8px 12px;max-height:180px;overflow-y:auto}
.cfg-body.open{display:block}
.cfg-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.cfg-row label{flex:1.2;color:#8b949e;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfg-row input,.cfg-row select{flex:1;background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:2px 5px;font:11px monospace;border-radius:4px;min-width:0}
.cfg-row input[type=checkbox]{flex:none;width:14px;height:14px;cursor:pointer}
.cfg-apply{margin-top:6px;text-align:right}

/* ── Leaflet dark tiles ── */
.leaflet-container{background:#0d1117}
</style>
</head>
<body>

<header>
  <h1>FalconGuide</h1>
  <div class="dot" id="dot"></div>
  <span id="connLabel" style="color:#484f58;font-size:11px">Disconnected</span>
  <div class="badge" id="statusBadge">Idle</div>
  <div class="spacer"></div>
  <span id="tsLabel"></span>
</header>

<div class="main">
  <div class="map-wrap">
    <div id="map"></div>
  </div>

  <div class="side">

    <!-- Navigation state -->
    <div class="box">
      <div class="box-title">Navigation State</div>
      <div class="grid2">
        <div class="kv"><span class="k">Lat</span><span class="v" id="sLat">—</span></div>
        <div class="kv"><span class="k">Lon</span><span class="v" id="sLon">—</span></div>
        <div class="kv"><span class="k">Alt</span><span class="v" id="sAlt">—</span></div>
        <div class="kv"><span class="k">Speed</span><span class="v" id="sSpd">—</span></div>
        <div class="kv"><span class="k">Heading</span><span class="v" id="sHdg">—</span></div>
        <div class="kv"><span class="k">Status</span><span class="v" id="sNavStatus">—</span></div>
        <div class="kv"><span class="k">Roll</span><span class="v" id="sRollDeg">—</span></div>
        <div class="kv"><span class="k">Pitch</span><span class="v" id="sPitch">—</span></div>
        <div class="kv"><span class="k">Pos σH</span><span class="v" id="sPosH">—</span></div>
        <div class="kv"><span class="k">Pos σV</span><span class="v" id="sPosV">—</span></div>
        <div class="kv"><span class="k">Vel σ</span><span class="v" id="sVelStd">—</span></div>
        <div class="kv"><span class="k">Init</span><span class="v" id="sInit">—</span></div>
      </div>
    </div>

    <!-- Replay -->
    <div class="box">
      <div class="box-title">Replay</div>
      <div class="controls">
        <button class="btn" onclick="cmd('start')">▶ Start</button>
        <button class="btn" id="btnPause" onclick="togglePause()">⏸ Pause</button>
        <button class="btn danger" onclick="cmd('stop')">■ Stop</button>
        <select id="speedSel" onchange="cmd('set_speed',{speed:+this.value})">
          <option value="0.1">0.1×</option>
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="5">5×</option>
          <option value="10">10×</option>
          <option value="0">Max</option>
        </select>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-text" id="progText">—</div>
    </div>

    <!-- Charts -->
    <div class="charts">
      <div class="tabs">
        <div class="tab active" id="tab-pos" onclick="switchTab('pos',this)">Position σ</div>
        <div class="tab" id="tab-vel" onclick="switchTab('vel',this)">Velocity</div>
        <div class="tab" id="tab-att" onclick="switchTab('att',this)">Attitude</div>
      </div>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
      </div>
    </div>

    <!-- Config editor -->
    <div class="cfg-panel">
      <div class="cfg-header" onclick="toggleCfg()">
        <span>Config</span>
        <span id="cfgArrow">▸</span>
      </div>
      <div class="cfg-body" id="cfgBody">
        <div id="cfgFields"></div>
        <div class="cfg-apply">
          <button class="btn" onclick="applyCfg()">Apply</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
'use strict';

// ── Map setup ─────────────────────────────────────────────────────────────────

const map = L.map('map',{center:[0,0],zoom:2,zoomControl:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap',maxZoom:20
}).addTo(map);

const traj = L.polyline([],{color:'#58a6ff',weight:2.5,opacity:.85}).addTo(map);
const marker = L.circleMarker([0,0],{
  radius:7,color:'#f85149',fillColor:'#f85149',fillOpacity:1,weight:2
}).addTo(map);
let mapCentered = false;

function updateMap(lat,lon){
  const ll=[lat,lon];
  traj.addLatLng(ll);
  marker.setLatLng(ll);
  if(!mapCentered){map.setView(ll,15);mapCentered=true;}
}

// ── Chart setup ───────────────────────────────────────────────────────────────

const MAX_PTS = 200;
const labels=[], posH=[], posV=[], velE=[], velN=[], velU=[], roll=[], pitch=[], yaw=[];

const mkDs=(label,data,color)=>({
  label,data,borderColor:color,backgroundColor:color+'22',
  borderWidth:1.5,pointRadius:0,tension:.3,fill:false
});

const datasets={
  pos:[mkDs('Horiz σ (m)',posH,'#58a6ff'),mkDs('Vert σ (m)',posV,'#3fb950')],
  vel:[mkDs('East (m/s)',velE,'#58a6ff'),mkDs('North (m/s)',velN,'#3fb950'),mkDs('Up (m/s)',velU,'#d29922')],
  att:[mkDs('Roll (°)',roll,'#58a6ff'),mkDs('Pitch (°)',pitch,'#3fb950'),mkDs('Yaw (°)',yaw,'#d29922')],
};

const chart = new Chart(document.getElementById('chart'),{
  type:'line',
  data:{labels,datasets:datasets.pos},
  options:{
    animation:false,responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#8b949e',font:{size:10},boxWidth:12}}},
    scales:{
      x:{ticks:{color:'#484f58',font:{size:9},maxTicksLimit:5,maxRotation:0},
         grid:{color:'#21262d'}},
      y:{ticks:{color:'#484f58',font:{size:9}},grid:{color:'#21262d'}},
    },
  },
});

let curTab='pos';
function switchTab(tab,el){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  chart.data.datasets=datasets[tab];
  chart.update('none');
}

function push(arr,v){arr.push(v);if(arr.length>MAX_PTS)arr.shift();}
function pushAll(ts,ph,pv,ve,vn,vu,r,p,y){
  push(labels,ts);push(posH,ph);push(posV,pv);
  push(velE,ve);push(velN,vn);push(velU,vu);
  push(roll,r);push(pitch,p);push(yaw,y);
  chart.update('none');
}

// ── WebSocket ─────────────────────────────────────────────────────────────────

let ws=null, paused=false;

function connect(){
  const host=location.hostname||'localhost';
  const port=location.port||'8765';
  ws=new WebSocket(`ws://${host}:${port}/`);

  ws.onopen=()=>{
    document.getElementById('dot').classList.add('on');
    document.getElementById('connLabel').textContent='Connected';
    document.getElementById('connLabel').style.color='#3fb950';
    send('get_status');
    send('get_schema');
  };

  ws.onclose=()=>{
    document.getElementById('dot').classList.remove('on');
    document.getElementById('connLabel').textContent='Disconnected';
    document.getElementById('connLabel').style.color='#484f58';
    setTimeout(connect,2500);
  };

  ws.onerror=()=>ws.close();

  ws.onmessage=(ev)=>{
    try{handle(JSON.parse(ev.data));}catch(_){}
  };
}

function send(c,extra={}){
  if(ws&&ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({cmd:c,...extra}));
}
function cmd(c,extra={}){send(c,extra);}

// ── Message handling ──────────────────────────────────────────────────────────

function handle(msg){
  switch(msg.event){
    case'nav_state': onNavState(msg); break;
    case'status':    onStatus(msg);   break;
    case'schema':    onSchema(msg);   break;
    default: break;
  }
}

function onNavState(d){
  if(d.lat_deg!=null&&d.lon_deg!=null) updateMap(d.lat_deg,d.lon_deg);

  const f=(v,dp,u)=>v!=null?`${(+v).toFixed(dp)} ${u}`:'—';
  document.getElementById('sLat').textContent  = d.lat_deg!=null?`${(+d.lat_deg).toFixed(5)}°`:'—';
  document.getElementById('sLon').textContent  = d.lon_deg!=null?`${(+d.lon_deg).toFixed(5)}°`:'—';
  document.getElementById('sAlt').textContent  = f(d.alt_m,1,'m');
  const v=d.vel_enu_mps;
  const spd=v?Math.sqrt(v[0]**2+v[1]**2).toFixed(2):'—';
  document.getElementById('sSpd').textContent  = spd!=='—'?`${spd} m/s`:'—';
  document.getElementById('sHdg').textContent  = d.yaw_deg!=null?`${((+d.yaw_deg+360)%360).toFixed(1)}°`:'—';
  document.getElementById('sRollDeg').textContent = f(d.roll_deg,2,'°');
  document.getElementById('sPitch').textContent= f(d.pitch_deg,2,'°');
  document.getElementById('sPosH').textContent = f(d.pos_std_h_m,3,'m');
  document.getElementById('sPosV').textContent = f(d.pos_std_v_m,3,'m');
  document.getElementById('sVelStd').textContent=f(d.vel_std_mps,3,'m/s');

  const ns=d.nav_status||'—';
  const nsEl=document.getElementById('sNavStatus');
  nsEl.textContent=ns;
  nsEl.className='v'+(ns==='nominal'?' ok':ns==='fault'?' warn':'');

  const iEl=document.getElementById('sInit');
  iEl.textContent=d.initialized?'Yes':'No';
  iEl.className='v'+(d.initialized?' ok':'');

  // Timestamp label
  if(d.timestamp_ns){
    document.getElementById('tsLabel').textContent=
      new Date(d.timestamp_ns/1e6).toISOString().replace('T',' ').substring(0,19)+' UTC';
  }

  // Charts
  const t=new Date().toISOString().substring(11,19);
  pushAll(t,
    d.pos_std_h_m??0, d.pos_std_v_m??0,
    v?v[0]:0, v?v[1]:0, v?v[2]:0,
    d.roll_deg??0, d.pitch_deg??0, d.yaw_deg??0
  );
}

function onStatus(d){
  const s=(d.status||'').toLowerCase();
  const badge=document.getElementById('statusBadge');
  badge.textContent=s.charAt(0).toUpperCase()+s.slice(1);
  badge.className='badge'+(s==='running'?' running':s==='error'?' error':'');

  if(d.measurements_read!=null){
    const pct=d.total_measurements>0
      ?(d.measurements_read/d.total_measurements*100).toFixed(1):0;
    document.getElementById('progFill').style.width=`${pct}%`;
    document.getElementById('progText').textContent=
      `${d.measurements_read}${d.total_measurements?' / '+d.total_measurements:''} measurements`;
  }
}

function onSchema(d){
  renderCfg(d.schema);
}

// ── Replay controls ───────────────────────────────────────────────────────────

function togglePause(){
  const btn=document.getElementById('btnPause');
  if(paused){
    send('resume');
    paused=false;
    btn.textContent='⏸ Pause';
    btn.classList.remove('active');
  } else {
    send('pause');
    paused=true;
    btn.textContent='▶ Resume';
    btn.classList.add('active');
  }
}

// ── Config editor ─────────────────────────────────────────────────────────────

let cfgOpen=false;
function toggleCfg(){
  cfgOpen=!cfgOpen;
  document.getElementById('cfgBody').classList.toggle('open',cfgOpen);
  document.getElementById('cfgArrow').textContent=cfgOpen?'▾':'▸';
  if(cfgOpen) send('get_schema');
}

function renderCfg(schema){
  const el=document.getElementById('cfgFields');
  el.innerHTML='';
  if(!schema) return;
  // Render top-level scalar fields and a flat view of nav sub-fields
  const flat=[
    ['playback_speed', schema.playback_speed, ''],
    ['backend',        schema.nav?.properties?.backend, 'nav.'],
  ];
  for(const [key, s, prefix] of flat){
    if(!s) continue;
    const row=document.createElement('div');
    row.className='cfg-row';
    const lbl=document.createElement('label');
    lbl.textContent=(prefix+key).replace('nav.','');
    row.appendChild(lbl);
    let inp;
    if(s.enum){
      inp=document.createElement('select');
      s.enum.forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;inp.appendChild(o);});
    } else if(s.type==='boolean'){
      inp=document.createElement('input');inp.type='checkbox';
    } else {
      inp=document.createElement('input');inp.type='text';
    }
    inp.dataset.path=prefix+key;
    row.appendChild(inp);
    el.appendChild(row);
  }
}

function applyCfg(){
  const inputs=document.querySelectorAll('#cfgFields [data-path]');
  const cfg={nav:{}};
  inputs.forEach(inp=>{
    const path=inp.dataset.path.split('.');
    let obj=cfg;
    for(let i=0;i<path.length-1;i++){obj[path[i]]=obj[path[i]]||{};obj=obj[path[i]];}
    const v=inp.type==='checkbox'?inp.checked:inp.value;
    obj[path[path.length-1]]=isNaN(v)||v===''?v:+v;
  });
  send('configure',{config:cfg});
}

// ── Init ──────────────────────────────────────────────────────────────────────

connect();
</script>
</body>
</html>
